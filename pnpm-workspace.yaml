packages:
  - apps/*
  - packages/*

# pnpm refuses to run dependency postinstall scripts unless approved here
# (`pnpm approve-builds <pkg>`). prisma/@prisma/engines fetch the schema
# engine, argon2 its prebuilt native binary, esbuild (used by tsx) its binary.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false

# nestjs-zod 5.5 declares peers up to Nest 11 / Swagger 11 but works on 12
# (verified by apps/api/test/platform.int-spec.ts). @nestjs/swagger lists
# class-validator/class-transformer as peers; we validate with zod instead.
peerDependencyRules:
  allowedVersions:
    'nestjs-zod>@nestjs/common': '12'
    'nestjs-zod>@nestjs/swagger': '12'
    # @vitest/mocker only needs msw for browser-mode mocking, which we do not use.
    '@vitest/mocker>msw': '3'
  ignoreMissing:
    - class-validator
    - class-transformer

